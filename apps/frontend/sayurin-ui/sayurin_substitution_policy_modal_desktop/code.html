<body class="bg-surface-container-lowest font-body-md text-on-surface antialiased min-h-screen relative">
<!-- Backdrop Overlay -->
<div class="fixed inset-0 bg-primary-container/40 flex items-center justify-center p-margin-mobile z-50">
<!-- Modal Card -->
<div class="bg-surface-container-lowest w-full max-w-[520px] rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.08)] flex flex-col max-h-[90vh]">
<!-- Sticky Header -->
<header class="sticky top-0 bg-surface-container-lowest rounded-t-2xl px-lg py-md border-b border-primary-container flex justify-between items-center z-10">
<h2 class="font-headline-md text-headline-md text-primary-container">Kebijakan Substitusi Otomatis</h2>
<button aria-label="Close" class="text-primary-container hover:bg-background rounded-full p-xs transition-colors">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
</header>
<!-- Scrollable Content Area -->
<div class="p-lg overflow-y-auto custom-scrollbar flex-1">
<!-- Intro Paragraph -->
<p class="font-body-md text-body-md text-primary-container mb-lg">
                    Tentukan bagaimana kami menangani pesanan Anda jika produk segar yang Anda inginkan sedang kosong.
                </p>
<!-- Radio Group -->
<div class="flex flex-col gap-md">
<!-- Option 1: Selected -->
<label class="relative flex cursor-pointer rounded-xl bg-[#F4F5F7] border-2 border-primary-container p-[19px] shadow-[0_4px_20px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] transition-all">
<div class="flex items-start">
<div class="flex h-6 items-center">
<input checked="" class="h-5 w-5 border-primary-container text-primary-container focus:ring-primary-container focus:ring-offset-surface-container-lowest" name="substitution-policy" type="radio" value="auto"/>
</div>
<div class="ml-md">
<span class="block font-label-md text-label-md text-primary-container mb-xs">Ganti Otomatis dengan Sayur Setara</span>
<span class="block font-body-md text-[14px] leading-[20px] text-primary-container">Kami akan memilihkan sayuran dengan kualitas dan tipe yang serupa (mis. bayam diganti dengan kale).</span>
</div>
</div>
</label>
<!-- Option 2: Unselected -->
<label class="relative flex cursor-pointer rounded-xl bg-surface-container-lowest border border-[#E2E4E9] p-5 hover:bg-[#F4F5F7]/50 hover:shadow-[0_4px_20px_rgba(0,0,0,0.04)] transition-all">
<div class="flex items-start">
<div class="flex h-6 items-center">
<input class="h-5 w-5 border-[#E2E4E9] text-primary-container focus:ring-primary-container focus:ring-offset-surface-container-lowest" name="substitution-policy" type="radio" value="whatsapp"/>
</div>
<div class="ml-md">
<span class="block font-label-md text-label-md text-primary-container mb-xs">Konfirmasi via WhatsApp</span>
<span class="block font-body-md text-[14px] leading-[20px] text-primary-container">Kami akan menghubungi Anda. Jika tidak ada respons dalam 15 menit, dana akan otomatis direfund.</span>
</div>
</div>
</label>
<!-- Option 3: Unselected -->
<label class="relative flex cursor-pointer rounded-xl bg-surface-container-lowest border border-[#E2E4E9] p-5 hover:bg-[#F4F5F7]/50 hover:shadow-[0_4px_20px_rgba(0,0,0,0.04)] transition-all">
<div class="flex items-start">
<div class="flex h-6 items-center">
<input class="h-5 w-5 border-[#E2E4E9] text-primary-container focus:ring-primary-container focus:ring-offset-surface-container-lowest" name="substitution-policy" type="radio" value="refund"/>
</div>
<div class="ml-md">
<span class="block font-label-md text-label-md text-primary-container mb-xs">Refund Otomatis ke Saldo E-Wallet</span>
<span class="block font-body-md text-[14px] leading-[20px] text-primary-container">Dana untuk item yang kosong akan langsung dikembalikan ke Sayurin Balance Anda.</span>
</div>
</div>
</label>
</div>
<!-- Note -->
<div class="mt-lg flex items-center gap-sm bg-[#F4F5F7] p-md rounded-xl">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">eco</span>
<p class="font-label-sm text-label-sm text-primary-container">Anda bisa mengubah pengaturan ini kapan saja sebelum pesanan diproses.</p>
</div>
</div>
<!-- Sticky Footer -->
<footer class="sticky bottom-0 bg-surface-container-lowest rounded-b-2xl px-lg py-md border-t border-primary-container flex justify-end gap-md z-10">
<button class="px-lg py-sm rounded-xl font-label-md text-label-md text-primary-container border-2 border-primary-container bg-surface-container-lowest hover:bg-[#F4F5F7] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container">
                    Batal
                </button>
<button class="px-lg py-sm rounded-xl font-label-md text-label-md text-surface-container-lowest bg-primary-container hover:bg-primary transition-colors shadow-[0_4px_20px_rgba(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgba(0,0,0,0.08)] active:shadow-none focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container">
                    Simpan Pengaturan
                </button>
</footer>
</div>
</div>
<style>
        /* Minimal custom scrollbar for modal content */
        .custom-scrollbar::-webkit-scrollbar {

        }

            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E4E9;
            border-radius: 9999px;
            border: 2px solid #ffffff;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {

        }
